<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>权限申请速查手册 · 按角色查看可申请权限</title>
<style>
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#fafbfd; --line:#e3e8f0;
  --text:#1b2434; --text-2:#5b6679; --text-3:#8b95a7;
  --brand:#2f5bd7; --brand-soft:#eaf0ff; --brand-deep:#1e3f9e;
  --ok:#0b8a5b; --ok-soft:#e6f6ef; --no:#a7afbd; --no-soft:#f1f3f6;
  --warn:#b26a00; --warn-soft:#fff4e0;
  --radius:12px; --shadow:0 1px 2px rgba(20,35,70,.04),0 6px 20px rgba(20,35,70,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Segoe UI,sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:12px 26px}
.brandbox{display:flex;align-items:center;gap:12px;min-width:270px}
.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2f5bd7,#5b86f0);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;box-shadow:0 4px 12px rgba(47,91,215,.25)}
.brandbox h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
.brandbox p{margin:0;font-size:11.5px;color:var(--text-3)}
.searchwrap{flex:1;max-width:560px;position:relative}
.searchwrap input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:0 36px 0 36px;font-size:13.5px;color:var(--text);outline:none;transition:.18s}
.searchwrap input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.searchwrap .icon{position:absolute;left:12px;top:9px;color:var(--text-3);font-size:15px}
.searchwrap .clear{position:absolute;right:10px;top:7px;border:0;background:transparent;color:var(--text-3);cursor:pointer;font-size:17px;display:none;line-height:1;padding:4px}
.actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn{border:1px solid var(--line);background:#fff;color:var(--text-2);border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;transition:.15s;font-family:inherit}
.btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-deep);color:#fff}
.toggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{accent-color:var(--brand);cursor:pointer}
.app{display:flex;align-items:flex-start;gap:0;max-width:1680px;margin:0 auto}
.sidebar{position:sticky;top:61px;height:calc(100vh - 61px);overflow-y:auto;width:248px;flex:0 0 248px;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px 40px}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:#d8dfe9;border-radius:3px}
.sidenav{border:0;background:transparent;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:13.5px;color:var(--text);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:9px;transition:.15s}
.sidenav:hover{background:var(--surface-2)}
.sidenav.active{background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
.sidegroup{margin:18px 12px 7px;font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--text-3);text-transform:uppercase}
.sidegroup.cat{margin:16px 12px 6px;font-size:12.5px;font-weight:800;letter-spacing:.5px;color:var(--text);display:flex;align-items:center;gap:6px}
.sidegroup.cat::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--brand);opacity:.55}
.sideitem{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;text-align:left;padding:7px 12px;border-radius:8px;font-size:13px;color:var(--text-2);cursor:pointer;font-family:inherit;transition:.15s}
.sideitem:hover{background:var(--surface-2);color:var(--text)}
.sideitem.active{background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
.sideitem .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.badge{background:#eef1f6;color:var(--text-2);border-radius:20px;padding:1px 7px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.sideitem.active .badge{background:#fff;color:var(--brand)}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.content{flex:1;min-width:0;padding:26px 30px 70px}
.crumb{font-size:12px;color:var(--text-3);margin-bottom:14px}
.crumb b{color:var(--text-2);font-weight:600}
.pagehead{margin-bottom:22px}
.pagehead h2{font-size:25px;margin:0 0 7px;font-weight:700;letter-spacing:-.3px}
.pagehead .sub{color:var(--text-2);font-size:13.5px;margin:0}
.hero{background:linear-gradient(120deg,#1e3f9e,#2f5bd7 55%,#5b86f0);color:#fff;border-radius:16px;padding:28px 32px;margin-bottom:22px;box-shadow:0 8px 28px rgba(30,63,158,.18);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero:before{content:"";position:absolute;right:60px;bottom:-130px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero h2{font-size:24px;margin:0 0 8px;font-weight:700}
.hero p{margin:0;opacity:.88;font-size:13.5px;max-width:760px;line-height:1.75;position:relative;z-index:1}
.hero .meta{margin-top:16px;font-size:12px;opacity:.75;position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .v{font-size:26px;font-weight:700;color:var(--brand-deep);font-variant-numeric:tabular-nums;line-height:1.2}
.stat .k{font-size:12px;color:var(--text-2);margin-top:5px}
.stat .h{font-size:11px;color:var(--text-3);margin-top:3px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:20px}
.panel h3{font-size:15px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel h3:before{content:"";width:3px;height:15px;background:var(--brand);border-radius:2px}
.panel .lead{font-size:13px;color:var(--text-2);margin:0 0 14px}
/* 申请流程 */
.flowsteps{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.fstep{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.fstep .fno{width:24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.fstep.done .fno{background:var(--ok-soft);color:var(--ok);font-size:13px}
.fstep .ft{font-size:13.5px;font-weight:700;margin-bottom:2px;line-height:1.5}
.fstep .fd{font-size:12.5px;color:var(--text-2);line-height:1.7}
.fstep .fd b{color:var(--text);font-weight:600}
.fstep .fd em{font-style:normal;color:var(--brand-deep);background:var(--brand-soft);border-radius:4px;padding:0 4px}
.fshot{margin-top:9px;display:grid;grid-template-columns:1fr;gap:8px}
.fshot.two{grid-template-columns:1fr 1fr}
.fshot figure{margin:0}
.fshot img{width:auto;max-width:100%;max-height:360px;margin:0 auto;display:block;border:1px solid var(--line);border-radius:8px;cursor:zoom-in;background:#fff;box-shadow:0 2px 8px rgba(20,35,70,.06);transition:.15s}
.fshot img:hover{box-shadow:0 6px 18px rgba(20,35,70,.14)}
.modal-body .fshot img{max-height:46vh}
.fshot figcaption{font-size:11px;color:var(--text-3);margin-top:5px}
.flowgallery{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.flowgallery figure{margin:0}
.flowgallery img{width:100%;display:block;border:1px solid var(--line);border-radius:7px;cursor:zoom-in;background:#fff;transition:.15s}
.flowgallery img:hover{border-color:#b9c9f0;box-shadow:0 6px 16px rgba(20,35,70,.12)}
.flowgallery figcaption{font-size:10.5px;color:var(--text-3);margin-top:4px;text-align:center;line-height:1.4}
@media(max-width:900px){.flowgallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
.flowbtn{vertical-align:3px;margin-left:10px;font-size:12px;border-color:#c6d4f5;background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
.flowbtn:hover{background:var(--brand);border-color:var(--brand);color:#fff}
/* 弹窗 */
.modal{position:fixed;inset:0;z-index:80;display:none}
.modal.show{display:block}
.modal-mask{position:absolute;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px)}
.modal-card{position:relative;margin:6vh auto 0;width:min(940px,94vw);max-height:88vh;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(15,23,42,.28);display:flex;flex-direction:column;overflow:hidden}
.modal-head{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16px;font-weight:700}
.modal-head .x{margin-left:auto;border:0;background:transparent;font-size:22px;line-height:1;color:var(--text-3);cursor:pointer;padding:2px 8px;border-radius:6px}
.modal-head .x:hover{background:var(--surface-2);color:var(--text)}
.modal-body{padding:16px 20px 20px;overflow:auto}
.imgbox{position:fixed;inset:0;z-index:90;display:none;background:rgba(10,16,30,.88);padding:3vh 3vw;cursor:zoom-out}
.imgbox.show{display:flex;align-items:center;justify-content:center}
.imgbox img{max-width:100%;max-height:94vh;border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.notice{display:flex;gap:10px;background:var(--warn-soft);border:1px solid #f3dfb9;color:#7a4d05;border-radius:9px;padding:11px 14px;font-size:12.5px;line-height:1.7;margin-bottom:18px}
.notice b{color:#8a5300}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:12.5px;color:var(--text-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--no-soft);color:var(--text-3)}
.pill.grp{background:var(--brand-soft);color:var(--brand-deep)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.rolecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.rolecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.18s;box-shadow:var(--shadow)}
.rolecard:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:0 8px 24px rgba(47,91,215,.13)}
.rolecard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rolecard .nm{font-size:15px;font-weight:700}
.rolecard .n{font-size:24px;font-weight:700;color:var(--brand-deep);font-variant-numeric:tabular-nums;margin-top:10px;line-height:1}
.rolecard .n small{font-size:11px;color:var(--text-3);font-weight:500;margin-left:4px}
.rolecard .bars{margin-top:12px;display:flex;flex-direction:column;gap:3px}
.rolecard .bar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3)}
.rolecard .bar .t{width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 0 88px}
.rolecard .bar .track{flex:1;height:5px;background:#eef1f6;border-radius:3px;overflow:hidden}
.rolecard .bar .fill{height:100%;background:linear-gradient(90deg,#2f5bd7,#6b93f5);border-radius:3px}
.rolecard .bar .c{width:24px;text-align:right;font-variant-numeric:tabular-nums}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 12px}
.sec-head h3{font-size:16px;margin:0;font-weight:700;display:flex;align-items:center;gap:9px}
.sec-head .count{font-size:12px;color:var(--text-3);font-weight:400}
.sysblock{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.syshead{padding:14px 18px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.syshead .t{font-size:15px;font-weight:700}
.syshead .spacer{flex:1}
.syslink{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--brand);text-decoration:none;border-bottom:1px dashed rgba(47,91,215,.45);padding-bottom:1px;white-space:nowrap;transition:.15s;border-radius:3px}
.syslink:hover{color:var(--brand-deep);border-bottom:1px solid var(--brand-deep);background:var(--brand-soft)}
.syshead .syslink{margin-left:-5px}
.pagehead h2 .syslink{margin-left:6px;vertical-align:3px}
.mmsyshead .syslink{margin-left:-5px}
.group{margin:0 14px 14px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.group:first-of-type{margin-top:14px}
.group>summary{cursor:pointer;padding:9px 14px;background:#fbfcfe;font-size:12.5px;font-weight:600;color:var(--text-2);list-style:none;display:flex;align-items:center;gap:8px;border-bottom:1px solid transparent}
.group[open]>summary{border-bottom-color:var(--line)}
.group>summary::-webkit-details-marker{display:none}
.group>summary:before{content:"▸";color:var(--text-3);font-size:12px;transition:.15s}
.group[open]>summary:before{transform:rotate(90deg)}
.group>summary .gn{flex:1}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#fff;color:var(--text-3);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);font-size:11.5px;letter-spacing:.3px;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #f0f2f6;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfe}
.pname{font-weight:600;color:var(--text)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:var(--brand-deep);background:var(--brand-soft);padding:2px 6px;border-radius:5px;word-break:break-all;display:inline-block}
.num{color:var(--text-3);font-variant-numeric:tabular-nums;font-size:11.5px}
.permtable{table-layout:fixed}
.permtable td.num,.permtable th:nth-child(3){text-align:right}
.note{color:var(--warn);font-size:11.5px}
.muted{color:var(--text-3)}
.matrix-scroll{overflow-x:auto}
.matrix{width:max-content;min-width:100%}
.matrix td:nth-child(1){min-width:180px}
.matrix td:nth-child(3){min-width:118px}
.matrix td:nth-child(4){min-width:258px}
.matrix th.rolecol,.matrix td.rolecol{text-align:center;min-width:74px;padding:8px 6px}
.matrix .yes{color:var(--ok);font-weight:700}
.matrix .no{color:#c3cad6}
.matrix .grpcap{font-size:10.5px;color:var(--text-3);font-weight:500}
.viewbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:-6px 0 16px}
.viewbar .tip{font-size:11.5px;color:var(--text-3)}
.viewswitch{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;margin-left:auto}
.viewswitch button{border:0;background:transparent;padding:6px 12px;font-size:12px;color:var(--text-2);cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.viewswitch button:hover{background:var(--surface-2)}
.viewswitch button.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
.btn.tiny{padding:5px 9px;font-size:11.5px;margin-left:6px}
.tree{padding:10px 16px 14px}
.tnode>.trow{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:7px;cursor:pointer;user-select:none}
.tnode>.trow:hover{background:#f6f9fe}
.ttog{width:12px;flex:0 0 12px;font-size:10px;color:#8b95a7;transition:transform .15s;display:inline-flex;justify-content:center}
.tnode.collapsed>.trow .ttog{transform:rotate(-90deg)}
.tnode.collapsed>.tchildren{display:none}
.tchildren{margin-left:6px;padding-left:15px;border-left:1px solid #e6ecf4}
.tname{font-size:13px;font-weight:600;color:var(--text)}
.tcount{font-size:10.5px;color:var(--text-3);background:#eef1f6;border-radius:9px;padding:0 6px;font-variant-numeric:tabular-nums}
.tleaf{display:flex;align-items:center;gap:9px;padding:4px 8px 4px 26px;border-radius:6px}
.tleaf:hover{background:#f6f9fe}
.ldot{width:5px;height:5px;border-radius:50%;background:#c3cad6;flex:0 0 5px}
.tleaf .ln{flex:0 1 auto;max-width:42%;min-width:0;font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tleaf .lc{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;color:var(--brand-deep);background:var(--brand-soft);border:1px solid transparent;border-radius:5px;padding:1px 6px;cursor:copy;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
.tleaf .lc:hover{border-color:#b9c9f0;background:#e2ebff}
.tleaf .lc.none{color:var(--text-3);background:#f5f7fa;cursor:default;font-family:inherit}
.tleaf .li{font-size:10.5px;color:var(--text-3);min-width:44px;text-align:left;font-variant-numeric:tabular-nums;flex:0 0 auto}
.tleaf.denied .ln{color:var(--text-3)}
.tleaf .pc-note{font-style:normal;font-size:10.5px;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 5px}
.mmbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.mmbar .tip{font-size:11.5px;color:var(--text-3)}
.mmtoc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 16px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.mmtoc-lb{font-size:11.5px;color:var(--text-3);margin-right:2px}
.mmchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px;font-size:12px;color:var(--text-2);cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.mmchip b{width:15px;height:15px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);font-size:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.mmchip span{color:var(--text-3);font-size:10.5px;font-variant-numeric:tabular-nums}
.mmchip:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.mmsys{margin:0 0 22px;scroll-margin-top:80px}
.mmsyshead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 8px;padding:0 2px}
.mmsyshead .t{font-size:14.5px;font-weight:700;color:var(--text)}
.mmsyshead .split-note{font-size:11.5px;color:var(--text-3)}
.mmsyshead .spacer{flex:1;min-width:8px}
.mmidx{width:21px;height:21px;border-radius:6px;background:var(--brand-soft);color:var(--brand-deep);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:0 0 21px;font-variant-numeric:tabular-nums}
.mmcanvas{position:relative;overflow:auto;height:660px;border:1px solid var(--line);border-radius:12px;background:#fcfdff;background-image:radial-gradient(#e9eef7 1px,transparent 1px);background-size:18px 18px;cursor:grab;box-shadow:var(--shadow)}
.mmcanvas.dragging{cursor:grabbing;user-select:none}
.mmcanvas::-webkit-scrollbar{width:9px;height:9px}
.mmcanvas::-webkit-scrollbar-thumb{background:#d5dce8;border-radius:5px}
.mmpan{position:relative}
.mmpan svg{display:block;transform-origin:0 0}
.mmnode{cursor:pointer}
.mmnode rect{transition:fill .14s,stroke-width .14s}
.mmnode:hover rect{fill:#fff;stroke-width:2.2}
.mmleaf{cursor:copy}
.mmleaf:hover text{fill:var(--brand);font-weight:600}
.mmleaf:hover circle{opacity:1;r:3.4}
.mmzoom{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:2px;margin-left:auto}

<script>
const D = JSON.parse(document.getElementById('payload').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sysByName = n => D.systems.find(s=>s.name===n);
const shortSys = n => String(n).replace(/（[^）]*）/g,'');
const groupColor = g => ({'管理层':'#7c3aed','运营':'#2f5bd7','产品':'#0891b2','技术':'#0b8a5b','病案':'#d97706','个案':'#db2777','业务':'#4f46e5','其他':'#64748b'}[g]||'#64748b');
const SYS_URL = {
  '运营后台（LION）':'https://boss.aistarfish.com/lion#/basicdata/',
  '知识库':'https://metis.aistarfish.com/#/',
  '患教资源库管理平台':'https://dtx.aistarfish.com/admin/patient-education/#/',
  '埋点管理系统':'https://boss.aistarfish.com/lion/data-tracker#/',
  '数据平台':'https://boss.aistarfish.com/lion/#/bi/dashboard/data:bi:dtx',
  '小二中心（权限管理）':'https://sso.aistarfish.com/#/index',
  'LEGO':'https://lego.aistarfish.com/#/group-detail?groupId=2&groupName=%E6%95%B0%E5%AD%97%E7%96%97%E6%B3%95%E9%97%AE%E5%8D%B7'
};
const sysUrl = n => SYS_URL[n] || '';
const sysHost = n => { const u=sysUrl(n); if(!u) return ''; try{ return new URL(u).host; }catch(e){ return u; } };
function sysLink(name,label){
  const u=sysUrl(name); if(!u) return '';
  return '<a class="syslink" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer" title="在新标签页打开：'+esc(u)+'">'+esc(label||'打开系统')+' ↗</a>';
}
let state = {view:'overview', key:null, q:'', showNo:false, full:false, layout:'mind'};

/* ---------- 申请流程 ---------- */
const FIMG = JSON.parse(document.getElementById('flowimg').textContent);
const FLOW_STEPS = [
  {t:'打开工作台',
   d:'登录后从左侧应用栏进入 <b>工作台</b>。',
   img:'s1', cap:'第一步：打开工作台'},
  {t:'找到「审批」并打开',
   d:'在「全部应用」里点击 <b>审批</b>，进入审批工作台。',
   img:'s2', cap:'第二步：打开「审批」'},
  {t:'筛选条件选择「技术」',
   d:'左侧点「发起申请」，顶部筛选切到 <b>技术</b>，列表只保留技术类申请。',
   img:'s3', cap:'第三步：筛选条件选择「技术」'},
  {t:'按岗位选择「平台权限申请」',
   d:'技术岗选 <b>平台权限审批（技术岗）</b>，非技术岗选 <b>平台权限审批（非技术岗）</b>。按自己的岗位属性选，选错会因岗位不符被退回。'},
  {t:'按要求填写内容后提交',
   d:'<b>技术岗</b>填「申请平台」，写清平台名称 + 需要的权限名称；<b>非技术岗</b>在「申请角色」里选本手册对应的角色名。申请理由写明用途与范围，然后点提交。',
   imgs:[['s4a','技术岗申请表'],['s4b','非技术岗申请表']]},
  {t:'等待审批通过',
   d:'流程为 <b>直接部门负责人 → 审批人 → 抄送人</b>，全部线上流转；通过后按系统地址登录，权限即时生效。',
   done:true}
];
function flowList(compact){
  return '<div class="flowsteps">'+FLOW_STEPS.map((s,i)=>{
    let shots='';
    if(!compact){
      if(s.img) shots='<div class="fshot"><figure><img src="'+FIMG[s.img]+'" alt="'+esc(s.cap)+'" data-zoom><figcaption>'+esc(s.cap)+'</figcaption></figure></div>';
      if(s.imgs) shots='<div class="fshot two">'+s.imgs.map(x=>'<figure><img src="'+FIMG[x[0]]+'" alt="'+esc(x[1])+'" data-zoom><figcaption>'+esc(x[1])+'</figcaption></figure>').join('')+'</div>';
    }
    return '<div class="fstep'+(s.done?' done':'')+'"><span class="fno">'+(s.done?'✓':(i+1))+'</span><div><div class="ft">'+s.t+'</div><div class="fd">'+s.d+'</div>'+shots+'</div></div>';
  }).join('')+'</div>';
}
function flowGallery(){
  const items=[['s1','第一步 打开工作台'],['s2','第二步 打开审批'],['s3','第三步 选择「技术」'],['s4a','技术岗申请表'],['s4b','非技术岗申请表']];
  return '<div class="flowgallery">'+items.map(x=>'<figure><img src="'+FIMG[x[0]]+'" alt="'+esc(x[1])+'" data-zoom><figcaption>'+esc(x[1])+'</figcaption></figure>').join('')+'</div>';
}
function flowPanel(){
  return '<div class="panel"><h3>申请流程</h3><p class="lead">平台权限统一在「审批」里申请，共 6 步。第 5 步填写的「申请角色」可直接用本手册左侧的角色名称；下方截图可点击放大，也可在任意角色 / 系统页右上角点「申请流程」查看带图完整版。</p>'+flowList(true)+flowGallery()+'</div>';
}
function openFlow(){
  document.getElementById('flowBody').innerHTML=flowList(false);
  const m=document.getElementById('flowModal'); m.classList.add('show'); m.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closeFlow(){
  const m=document.getElementById('flowModal'); m.classList.remove('show'); m.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}
function zoomImg(src){
  const b=document.getElementById('imgbox'); document.getElementById('imgboxImg').src=src;
  b.classList.add('show');
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  const b=document.getElementById('imgbox');
  if(b.classList.contains('show')){ b.classList.remove('show'); return; }
  closeFlow();
});
document.addEventListener('click',e=>{
  const z=e.target.closest('[data-zoom]');
  if(z){ zoomImg(z.getAttribute('src')); return; }
  if(e.target.closest('[data-flow-close]')){ closeFlow(); return; }
  if(e.target.closest('#imgbox')){ document.getElementById('imgbox').classList.remove('show'); return; }
  if(e.target.closest('[data-flow]')){ openFlow(); }
});
function layoutSwitch(){
  const on = v => state.layout===v ? ' class="on"' : '';
  return '<div class="viewswitch"><button data-layout="mind"'+on('mind')+'>思维导图</button><button data-layout="card"'+on('card')+'>卡片</button></div>';
}
const LAYOUT_TIP={
  mind:'思维导图：每个系统一张独立导图，中心为该系统，点带 + 的分类节点展开权限',
  card:'卡片视图：一条一张卡片，展示权限名称与编号'
};
function treeTools(){ return ''; }

function yesRoles(item, sys){
  return sys.roles.filter(r=>item.rights[r.name]==='√').map(r=>r.name);
}
function itemMatch(it, q){
  if(!q) return true;
  const hay = [it.name,it.code,it.id,it.cat,it.note,it.desc].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t=>hay.includes(t));
}
function pill(g){return '<span class="pill grp" style="background:'+groupColor(g)+'18;color:'+groupColor(g)+'">'+esc(g)+'</span>';}

function renderSidebar(){
  let h = '<button class="sidenav'+(state.view==='overview'?' active':'')+'" data-nav="overview">▦ &nbsp;总览</button>';
  h += '<div class="sidegroup">按角色查找</div>';
  const groups = {};
  D.roles.forEach(r=>(groups[r.group]=groups[r.group]||[]).push(r));
  D.groupOrder.concat(Object.keys(groups).filter(g=>!D.groupOrder.includes(g))).forEach(g=>{
    if(!groups[g]||!groups[g].length) return;
    h += '<div class="sidegroup cat">'+esc(g)+'</div>';
    groups[g].forEach(r=>{
      h += '<button class="sideitem'+(state.view==='role'&&state.key===r.name?' active':'')+'" data-nav="role" data-key="'+esc(r.name)+'"><span class="dot" style="background:'+groupColor(g)+'"></span><span class="nm">'+esc(r.name)+'</span><span class="badge">'+r.count+'</span></button>';
    });
  });
  h += '<div class="sidegroup" style="margin-top:20px">按系统查找 · 已配置角色</div>';
  D.systems.filter(s=>s.matrix).forEach(s=>{
    h += '<button class="sideitem'+(state.view==='system'&&state.key===s.name?' active':'')+'" data-nav="system" data-key="'+esc(s.name)+'"><span class="dot" style="background:#2f5bd7"></span><span class="nm">'+esc(s.name)+'</span><span class="badge">'+s.items.length+'</span></button>';
  });
  h += '<div class="sidegroup" style="margin-top:14px">仅权限清单 · 待补充角色</div>';
  D.systems.filter(s=>!s.matrix).forEach(s=>{
    h += '<button class="sideitem'+(state.view==='system'&&state.key===s.name?' active':'')+'" data-nav="system" data-key="'+esc(s.name)+'"><span class="dot" style="background:#d97706"></span><span class="nm">'+esc(s.name)+'</span><span class="badge">'+s.items.length+'</span></button>';
  });
  $('#sidebar').innerHTML = h;
  $('#sidebar').querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{
    state.view=b.dataset.nav; state.key=b.dataset.key||null; state.full=false;
    if(state.q){state.q='';$('#q').value='';$('#clearq').style.display='none';}
    render();
  }));
}

function statsHtml(){

/* ================= 思维导图视图 ================= */
const MM_PALETTE=['#4a72d8','#8b5cf6','#f59e0b','#16a34a','#ec4899','#0ea5e9','#ef4444','#0d9488','#6366f1','#d97706'];
const MM={VG:11,HG:44};
const mmState={sig:'',collapsed:new Set(),mapDefaults:{},zoom:{}};

function mmTextW(s,fs){
  let w=0;
  for(const ch of String(s==null?'':s)){
    const c=ch.codePointAt(0);
    if(c>=0x2e80) w+=fs*1.02;
    else if(ch===' ') w+=fs*0.28;
    else if(/[A-Z]/.test(ch)) w+=fs*0.64;
    else if(/[a-z0-9]/.test(ch)) w+=fs*0.55;
    else w+=fs*0.45;
  }
  return w;
}
function mmCatTree(items,maxDepth){
  const root={name:'',children:new Map(),items:[]};
  items.forEach(it=>{
    const parts=(it.cat&&it.cat!=='未分类')?it.cat.split(' › '):['未分类'];
    let segs=parts.slice(0,maxDepth);
    if(parts.length>maxDepth) segs[maxDepth-1]=parts.slice(maxDepth-1).join(' › ');
    let n=root;
    segs.forEach(p=>{ if(!n.children.has(p)) n.children.set(p,{name:p,children:new Map(),items:[]}); n=n.children.get(p); });
    n.items.push(it);
  });
  return root;
}
function mmConvert(node,depth,key,color){
  const out={key,label:node.name,depth,color,children:[],leaf:false,count:0};
  let i=0;
  node.children.forEach(cn=>out.children.push(mmConvert(cn,depth+1,key+'/'+(i++),color)));
  node.items.forEach((it,j)=>out.children.push({
    key:key+'#p'+j,label:it.name||'（未命名）',depth:depth+1,color,leaf:true,
    code:it.code||'',pid:it.id||'',note:it.note||'',denied:!!it.denied,count:1
  }));
  out.count=node.items.length+out.children.reduce((a,c)=>a+c.count,0);
  return out;
}
/* 每个系统一张独立导图：中心节点 = 系统 */
function mmMaps(){
  const q=state.q.trim();
  const maps=[];
  if(state.view==='system'){
    const s=sysByName(state.key);
    if(!s) return maps;
    const items=s.items.filter(it=>itemMatch(it,q));
    if(!items.length) return maps;
    maps.push({id:'m0',sys:s,items,role:null,sub:(s.matrix?s.roles.length+' 个角色':'无角色映射')});
  }else{
    const r=D.roles.find(x=>x.name===state.key);
    if(!r) return maps;
    let gi=0;
    D.systems.filter(s=>s.matrix&&r.bySystem[s.name]!==undefined).forEach(s=>{
      const all=s.items.filter(it=>itemMatch(it,q));
      const list=state.showNo?all.filter(it=>it.rights[r.name]!==undefined):all.filter(it=>it.rights[r.name]==='√');
      if(!list.length) return;
      maps.push({id:'m'+(gi++),sys:s,role:r.name,
        items:list.map(it=>Object.assign({},it,{denied:it.rights[r.name]!=='√'})),
        sub:'系统内共 '+s.items.length+' 项权限'});
    });
  }
  return maps;
}
function mmBuildRoot(map){
  const root={key:map.id+'|r',label:map.sys.name,sub:map.sub,depth:0,children:[],leaf:false,count:0};
  const t=mmCatTree(map.items,3);
  [...t.children.values()].forEach((cn,i)=>root.children.push(mmConvert(cn,1,root.key+'/'+i,MM_PALETTE[i%MM_PALETTE.length])));
  root.count=map.items.length;
  return root;
}
function mmDefaults(root){
  const set=new Set();
  (function walk(n){
    n.children.forEach(c=>{
      if(c.leaf) return;
      if(c.depth>=2) set.add(c.key);
      walk(c);
    });
  })(root);
  return set;
}
function mmVisibleLeaves(root,collapsed){
  let n=0;
  (function walk(node,hidden){
    node.children.forEach(c=>{
      if(c.leaf){ if(!hidden) n++; return; }
      walk(c,hidden||collapsed.has(c.key));
    });
  })(root,false);
  return n;
}
function mmSize(n){
  const d=Math.min(n.depth,4);
  n.fs = d===0?17 : d===1?13.5 : d===2?12.5 : 12;
  if(n.leaf){ n.h=22; n.w=mmTextW(n.label,12)+18; return; }
  const hasKids=n.children.length>0;
  const inner=hasKids?24:8;
  const pad=n.depth===0?24:12;
  const countW=n.depth>0?mmTextW(String(n.count),10)+7:0;
  n.h = d===0?64 : d===1?32 : 27;
  n.pad=pad; n.innerInner=inner;
  n.w = mmTextW(n.label,n.fs)+countW+pad*2+inner;
  if(n.depth===0) n.w=Math.max(mmTextW(n.label,17),mmTextW(n.sub,11))+pad*2;
}
function mmMeasure(n,collapsed,dir){
  n.dir=dir; mmSize(n);
  n.kids=(!n.leaf&&!collapsed.has(n.key))?n.children:[];
  if(!n.kids.length){ n.visH=n.h; n.blockH=n.h; return; }
  n.kids.forEach(c=>mmMeasure(c,collapsed,dir));
  n.blockH=n.kids.reduce((a,c)=>a+c.visH,0)+MM.VG*(n.kids.length-1);
  n.visH=Math.max(n.h,n.blockH);
}
function mmCols(list){
  const cols={};
  const walk=n=>{ cols[n.depth]=Math.max(cols[n.depth]||0,n.w); n.kids.forEach(walk); };
  list.forEach(walk);
  return cols;
}
function mmPlaceNode(n,top,X){
  n.x = n.dir>0 ? X[n.depth] : X[n.depth]-n.w;
  if(!n.kids.length){ n.y=top+n.visH/2; return; }
  let cur=top+(n.visH-n.blockH)/2;
  n.kids.forEach(c=>{ mmPlaceNode(c,cur,X); cur+=c.visH+MM.VG; });
  n.y=(n.kids[0].y+n.kids[n.kids.length-1].y)/2;
}
function mmPlaceSide(list,dir,rootW){
  const cols=mmCols(list);
  const X={};
  X[1]=dir>0?rootW/2+MM.HG:-rootW/2-MM.HG;
  const maxD=Math.max(1,...Object.keys(cols).map(Number));
  for(let d=2;d<=maxD;d++){
    X[d]=dir>0? X[d-1]+(cols[d-1]||0)+MM.HG : X[d-1]-((cols[d-1]||0)+MM.HG);
  }
  let total=list.reduce((a,c)=>a+c.visH,0)+MM.VG*Math.max(0,list.length-1);
  let top=-total/2;
  list.forEach(n=>{ mmPlaceNode(n,top,X); top+=n.visH+MM.VG; });
}
function mmLink(p,c){
  const dir=c.dir||1;
  let x1,y1,x2,y2;
  if(dir>0){ x1=p.x+p.w; y1=p.y; x2=c.x; y2=c.y; }
  else{ x1=p.x; y1=p.y; x2=c.x+c.w; y2=c.y; }
  const mx=(x1+x2)/2;
  return '<path d="M'+x1+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="'+c.color+'" stroke-width="'+(p.depth===0?2.2:1.6)+'" stroke-linecap="round" opacity=".8"/>';
}
function mmNodeSvg(n){
  if(n.leaf){
    const start=n.dir>0;
    const textX = start? n.x+15 : n.x+n.w-15;
    const dotX = start? n.x+4 : n.x+n.w-4;
    const tip=(n.denied?'不可申请 · ':'')+esc(n.label)+(n.code?' · '+esc(n.code):'')+(n.pid?' · #'+esc(n.pid):'');
    return '<g class="mmleaf"'+(n.code?' data-copy="'+esc(n.code)+'"':'')+'><title>'+tip+'</title>'
      +'<circle cx="'+dotX+'" cy="'+n.y+'" r="2.6" fill="'+(n.denied?'#c9d0da':n.color)+'" opacity="'+(n.denied?'.9':'.5')+'"/>'
      +'<text x="'+textX+'" y="'+n.y+'" text-anchor="'+(start?'start':'end')+'" dominant-baseline="central" font-size="12.5" fill="'+(n.denied?'#a6aebc':'#44506a')+'">'+esc(n.label)+'</text></g>';
  }
  if(n.depth===0){
    return '<g class="mmroot"><title>'+esc(n.label)+' · '+esc(n.sub)+'</title>'
      +'<rect x="'+n.x+'" y="'+(n.y-32)+'" width="'+n.w+'" height="64" rx="18" fill="#fff" stroke="#2f5bd7" stroke-width="2.4"/>'
      +'<text x="0" y="'+(n.y-7)+'" text-anchor="middle" dominant-baseline="central" font-size="17" font-weight="700" fill="#1e3f9e">'+esc(n.label)+'</text>'
      +'<text x="0" y="'+(n.y+17)+'" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#8b95a7">'+esc(n.sub)+'</text></g>';
  }
  const hasKids=n.children.length>0;
  const collapsed=hasKids&&n.kids.length===0;
  const pad=n.pad, inner=n.innerInner;
  const labelX = n.dir>0 ? n.x+pad+inner : n.x+n.w-pad-inner;
  const txtFill = n.depth<=2 ? n.color : '#334155';
  const fill = n.depth===1 ? n.color+'10' : '#ffffff';
  const cx = n.dir>0 ? n.x+12 : n.x+n.w-12;
  let g='<g class="mmnode" data-mmkey="'+esc(n.key)+'"><title>'+esc(n.label)+' · '+n.count+' 项'+(hasKids?(collapsed?' · 点击展开':' · 点击收起'):'')+'</title>';
  g+='<rect x="'+n.x+'" y="'+(n.y-n.h/2)+'" width="'+n.w+'" height="'+n.h+'" rx="'+(n.h/2)+'" fill="'+fill+'" stroke="'+n.color+'" stroke-width="1.5"/>';
  if(hasKids){
    g+='<circle cx="'+cx+'" cy="'+n.y+'" r="7" fill="#fff" stroke="'+n.color+'" stroke-width="1" opacity=".9"/>'
      +'<text x="'+cx+'" y="'+n.y+'" text-anchor="middle" dominant-baseline="central" font-size="11" fill="'+n.color+'">'+(collapsed?'+':'−')+'</text>';
  }
  g+='<text x="'+labelX+'" y="'+n.y+'" text-anchor="'+(n.dir>0?'start':'end')+'" dominant-baseline="central" font-size="'+n.fs+'" fill="'+txtFill+'" font-weight="'+(n.depth===1?600:500)+'">'+esc(n.label)
    +'<tspan dx="6" font-size="10" fill="'+n.color+'" opacity=".72">'+n.count+'</tspan></text></g>';
  return g;
}
function mmRenderSvg(root){
  const parts=[];
  (function walk(n){ n.kids.forEach(c=>{ parts.push(mmLink(n,c)); walk(c); }); })(root);
  (function walk(n){ parts.push(mmNodeSvg(n)); n.kids.forEach(walk); })(root);
  return parts.join('');
}
function mmLayout(root){
  mmSize(root); root.dir=0;
  root.kids=mmState.collapsed.has(root.key)?[]:root.children;
  root.kids.forEach(c=>mmMeasure(c,mmState.collapsed));
  root.x=-root.w/2; root.y=0;
  const split=root.children.map((n,i)=>({n,i})).sort((a,b)=>b.n.count-a.n.count);
  const L=[],R=[]; let wl=0,wr=0;
  split.forEach(b=>{ if(wl<=wr){L.push(b);wl+=b.n.count;} else {R.push(b);wr+=b.n.count;} });
  L.sort((a,b)=>a.i-b.i); R.sort((a,b)=>a.i-b.i);
  R.forEach(b=>{ b.n.dir=1; mmMeasure(b.n,mmState.collapsed,1); });
  L.forEach(b=>{ b.n.dir=-1; mmMeasure(b.n,mmState.collapsed,-1); });
  mmPlaceSide(R.map(b=>b.n),1,root.w);
  mmPlaceSide(L.map(b=>b.n),-1,root.w);
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  (function walk(n){
    x1=Math.min(x1,n.x); x2=Math.max(x2,n.x+n.w);
    y1=Math.min(y1,n.y-n.h/2); y2=Math.max(y2,n.y+n.h/2);
    n.kids.forEach(walk);
  })(root);
  const PAD=46;
  const W=Math.ceil(x2-x1+PAD*2), H=Math.ceil(y2-y1+PAD*2);
  return {inner:mmRenderSvg(root),W,H,tx:PAD-x1,ty:PAD-y1};
}
function mmMapHtml(map,root,idx){
  const L=mmLayout(root);
  const svg='<svg width="'+L.W+'" height="'+L.H+'" data-w="'+L.W+'" data-h="'+L.H+'" data-ax="'+(L.W/2)+'" data-ay="'+(L.H/2)+'" viewBox="0 0 '+L.W+' '+L.H+'" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">'
    +'<g transform="translate('+L.tx+' '+L.ty+')">'+L.inner+'</g></svg>';
  const id=map.id;
  const head='<div class="mmsyshead">'
    +'<span class="mmidx">'+(idx+1)+'</span>'
    +'<span class="t">'+esc(map.sys.name)+'</span>'+sysLink(map.sys.name)
    +(map.role?'<span class="pill ok">√ '+mmMapYes(root)+' 项可申请</span>':'<span class="pill grp">'+map.items.length+' 项权限</span>')
    +'<span class="split-note">'+esc(map.sub)+' · '+root.children.length+' 个一级分类</span>'
    +'<span class="spacer"></span>'
    +'<button class="btn tiny" data-mm="all" data-map="'+id+'">展开全部</button>'
    +'<button class="btn tiny" data-mm="default" data-map="'+id+'">收起到分类</button>'
    +'<div class="mmzoom"><button data-mm="out" data-map="'+id+'" title="缩小">−</button><button data-mm="one" data-map="'+id+'" class="lv" id="mmk-'+id+'">100%</button><button data-mm="in" data-map="'+id+'" title="放大">+</button><button data-mm="fit" data-map="'+id+'">适应</button></div>'
    +'</div>';
  return '<div class="mmsys" id="mmsys-'+id+'">'+head+'<div class="mmcanvas" id="mmc-'+id+'" data-map="'+id+'"><div class="mmpan">'+svg+'</div></div></div>';
}
function mmMapYes(root){
  let n=0;
  (function walk(node){ node.children.forEach(c=>{ if(c.leaf){ if(!c.denied) n++; } else walk(c); }); })(root);
  return n;
}
function mindView(){
  const maps=mmMaps();
  if(!maps.length) return '<div class="panel"><div class="empty">没有匹配的权限项，试试更短的关键词，或勾选「同时显示不可申请项」。</div></div>';
  const sig=[state.view,state.key,state.q.trim(),state.showNo?1:0].join('|');
  const fresh=mmState.sig!==sig;
  if(fresh){ mmState.sig=sig; mmState.collapsed=new Set(); mmState.zoom={}; mmState.mapDefaults={}; }
  const built=maps.map(m=>{
    const root=mmBuildRoot(m);
    mmState.mapDefaults[m.id]=mmDefaults(root);
    if(fresh) mmState.mapDefaults[m.id].forEach(k=>mmState.collapsed.add(k));
    return {map:m,root};
  });
  // 每张图各自收敛叶子数量，互不影响
  built.forEach(b=>{
    const nodes=[];
    (function walk(n){ n.children.forEach(c=>{ if(!c.leaf){ nodes.push(c); walk(c); } }); })(b.root);
    let guard=0;
    while(mmVisibleLeaves(b.root,mmState.collapsed)>60 && guard++<40){
      let best=null;
      nodes.forEach(c=>{ if(!mmState.collapsed.has(c.key)&&(!best||c.count>best.count)) best=c; });
      if(!best) break;
      mmState.collapsed.add(best.key);
    }
  });
  let h='';
  if(built.length>1){
    h+='<div class="mmtoc"><span class="mmtoc-lb">共 '+built.length+' 个系统，各一张导图</span>'
      +built.map((b,i)=>'<button class="mmchip" data-jump="'+b.map.id+'"><b>'+(i+1)+'</b>'+esc(shortSys(b.map.sys.name))+'<span>'+b.root.count+'</span></button>').join('')+'</div>';
  }
  h+=built.map((b,i)=>mmMapHtml(b.map,b.root,i)).join('');
  h+='<div class="foot">每张导图的中心节点为'+(state.view==='system'?'该系统':'该角色在此系统中的权限范围')+'，一级分支为业务分类'
    +(state.view==='system'?'':'（系统已拆分为独立导图，不再共用中心节点）')
    +'，节点后的数字为该分支下的权限条数。带 <b>+</b> 的节点可点开查看权限明细，点击权限名称可复制权限标识。'
    +(state.showNo?'当前包含不可申请项，灰色叶子为不可申请权限。':'')
    +'</div>';
  return h;
}
function mmApplyZoom(id){
  const list = id ? [document.getElementById('mmc-'+id)] : Array.prototype.slice.call(document.querySelectorAll('#content .mmcanvas'));
  list.forEach(canvas=>{
    if(!canvas) return;
    const mid=canvas.getAttribute('data-map');
    const svg=canvas.querySelector('svg'); if(!svg) return;
    const W=+svg.dataset.w, H=+svg.dataset.h;
    const z=mmState.zoom[mid]||(mmState.zoom[mid]={k:1,kSet:false,centered:false});
    if(!z.kSet){
      const fit=(canvas.clientWidth-64)/W;
      z.k=Math.min(1.3,Math.max(0.3,fit));
      z.kSet=true;
    }
    const k=z.k;
    canvas.style.height=Math.round(Math.max(240,Math.min(620,H*k+16)))+'px';
    const svg2=canvas.querySelector('svg');
    svg2.style.width=W+'px'; svg2.style.height=H+'px';
    svg2.style.transform='scale('+k+')';
    const pan=canvas.querySelector('.mmpan');
    pan.style.width=(W*k)+'px'; pan.style.height=(H*k)+'px';
    const cw=canvas.clientWidth, ch=canvas.clientHeight;
    const ax=(+svg.dataset.ax||W/2)*k, ay=(+svg.dataset.ay||H/2)*k;
    const mx=Math.max(0,Math.min(cw/2-ax, cw-W*k-8));
    const my=Math.max(0,Math.min(ch/2-ay, ch-H*k-8));
    pan.style.marginLeft=Math.round(mx)+'px';
    pan.style.marginTop=Math.round(my)+'px';
    const lv=document.getElementById('mmk-'+mid); if(lv) lv.textContent=Math.round(k*100)+'%';
    if(!z.centered){
      canvas.scrollLeft=Math.max(0,ax+mx-cw/2);
      canvas.scrollTop=Math.max(0,ay+my-ch/2);
      z.centered=true;
    }
  });
}

function groupBlocks(items, sys, opts){
  opts=opts||{};
  if(state.layout==='tree') return treeBlock(items, opts);
  const g={};
  items.forEach(it=>(g[it.cat]=g[it.cat]||[]).push(it));
  const keys=Object.keys(g);
  const card=state.layout==='card' && !opts.forceTable;
  return keys.map(k=>{
    const inner = card
      ? cardRows(g[k],opts)
      : '<div><table class="permtable"><colgroup><col style="width:'+(opts.showCat?'24%':'30%')+'"><col><col style="width:92px">'+(opts.showCat?'<col style="width:26%">':'')+'</colgroup><thead><tr><th>权限名称</th><th>权限标识</th><th>编号</th>'+(opts.showCat?'<th>业务分类</th>':'')+'</tr></thead><tbody>'+tableRows(g[k],sys,opts)+'</tbody></table></div>';
    return '<details class="group" open><summary><span class="gn">'+esc(k)+'</span><span class="badge">'+g[k].length+'</span></summary>'+inner+'</details>';
  }).join('');
}

function roleView(name){
  const r=D.roles.find(x=>x.name===name); if(!r) return '<div class="empty">未找到角色</div>';
  let h='<div class="crumb"><b>按角色查找</b> / '+esc(r.group)+' / '+esc(name)+'</div><div class="pagehead"><h2>'+esc(name)+' <span style="font-size:14px;font-weight:500;color:var(--text-3)">'+pill(r.group)+'</span><button class="btn tiny flowbtn" data-flow>申请流程</button></h2><p class="sub">共 <b style="color:var(--brand-deep)">'+r.count+'</b> 项可申请权限，覆盖 '+r.sysCount+' 个系统 · 按系统与业务分类分组</p></div>';
  h+='<div class="viewbar"><span class="tip">'+(LAYOUT_TIP[state.layout]||'')+'</span>'+layoutSwitch()+'</div>';
  if(state.layout==='mind') return h+mindView();
  const q=state.q.trim();
  let total=0, blocks='';
  D.systems.filter(s=>s.matrix&&r.bySystem[s.name]!==undefined).forEach(s=>{
    const all=s.items.filter(it=>itemMatch(it,q));
    const yes=all.filter(it=>it.rights[name]==='√');
    const list=state.showNo?all:yes;
    if(!list.length) return;
    total+=list.length;
    blocks+='<div class="sysblock"><div class="syshead"><span class="t">'+esc(s.name)+'</span>'+sysLink(s.name)+'<span class="pill ok">√ '+yes.length+' 项可申请</span>'+(state.showNo?'<span class="muted" style="font-size:11.5px">共 '+all.length+' 项，灰色标签为不可申请</span>':'')+'<span class="spacer"></span><span class="muted" style="font-size:11.5px">系统内共 '+s.items.length+' 项权限</span></div>'+groupBlocks(list,s,{role:name})+'</div>';
  });
  if(q) h+='<div class="notice">搜索「'+esc(q)+'」：在当前角色范围内命中 <b>'+total+'</b> 条'+(state.showNo?'（含不可申请项）':'（仅可申请项，勾选顶部可显示全部）')+'。</div>';
  h+= blocks || '<div class="panel"><div class="empty">没有匹配的权限项，试试更短的关键词，或勾选「同时显示不可申请项」。</div></div>';
  return h;
}

function systemView(name){
  const s=sysByName(name); if(!s) return '<div class="empty">未找到系统</div>';
  const q=state.q.trim();
  let h='<div class="crumb"><b>按系统查找</b> / '+esc(name)+'</div><div class="pagehead"><h2>'+esc(name)+' '+sysLink(name)+'<button class="btn tiny flowbtn" data-flow>申请流程</button></h2><p class="sub">共 '+s.items.length+' 项权限 · '+(s.matrix?'已配置 '+s.roles.length+' 个角色':'暂无角色映射')+'</p></div>';
  const list=s.items.filter(it=>itemMatch(it,q));
  if(state.layout==='mind'){
    h+='<div class="viewbar"><span class="tip">'+(LAYOUT_TIP.mind||'')+'</span>'+layoutSwitch()+'</div>';
    return h+mindView();
  }
  h+='<div class="sec-head"><h3>权限清单 <span class="count">按业务分类分组 · '+list.length+' 条</span></h3>'+layoutSwitch()+'</div>';
  h+= list.length? '<div class="sysblock" style="padding-bottom:2px">'+groupBlocks(list,s,{showCat:false})+'</div>' : '<div class="panel"><div class="empty">没有匹配的权限项</div></div>';
  return h;
}

function searchView(q){
  let h='<div class="crumb"><b>全局搜索</b> / '+esc(q)+'</div><div class="pagehead"><h2>搜索结果</h2><p class="sub">关键词：<b>'+esc(q)+'</b> · 匹配权限名称、权限标识、编号、业务分类与备注</p></div>';
  let n=0, out='';
  D.systems.forEach(s=>{
    const list=s.items.filter(it=>itemMatch(it,q));
    if(!list.length) return;
    n+=list.length;
    out+='<div class="sysblock"><div class="syshead"><span class="t">'+esc(s.name)+'</span><span class="badge">'+list.length+' 条</span><span class="spacer"></span>'+(s.matrix?'<span class="pill ok">已配置角色</span>':'<span class="pill warn">无角色映射</span>')+'</div>'+list.map(it=>{
      const yr=s.matrix?yesRoles(it,s):[];
      return '<div class="resultitem" style="padding:11px 18px"><div class="r1"><span class="pname">'+esc(it.name||'（未命名）')+'</span>'+(it.code?'<span class="code">'+esc(it.code)+'</span>':'')+(it.id?'<span class="num">#'+esc(it.id)+'</span>':'')+(it.note?'<span class="note">⚑ '+esc(it.note)+'</span>':'')+'</div><div class="r2">'+esc(it.cat)+'</div>'+(yr.length?'<div class="tagline">'+yr.map(r=>'<span class="pill ok">√ '+esc(r)+'</span>').join('')+'</div>':'<div class="tagline"><span class="pill warn">待补充角色映射</span></div>')+'</div>';
    }).join('')+'</div>';
  });
  const syscount=D.systems.filter(s=>s.items.some(it=>itemMatch(it,q))).length;
  h+='<div class="notice">共命中 <b>'+n+'</b> 条权限项，分布在 <b>'+syscount+'</b> 个系统。绿色标签为该系统内可申请此权限的角色。</div>';
  h+= out || '<div class="panel"><div class="empty">没有匹配结果，试试更短的关键词。</div></div>';
  return h;
}

function fullView(){
  let h='<div class="crumb"><b>完整清单</b> / 打印归档用</div><div class="pagehead"><h2>全部角色 · 可申请权限完整清单</h2><p class="sub">按角色组顺序展开，共 '+D.roles.length+' 个角色 / '+D.stats.matrixItems+' 项可申请权限条目（∑ 角色 × 权限 = '+D.stats.yes+' 条关系）</p></div>';
  D.roles.forEach(r=>{
    h+='<div class="sec-head"><h3>'+esc(r.name)+' '+pill(r.group)+' <span class="count">'+r.count+' 项</span></h3></div>';
    D.systems.filter(s=>s.matrix&&r.bySystem[s.name]!==undefined).forEach(s=>{
      const list=s.items.filter(it=>it.rights[r.name]==='√');
      if(!list.length) return;
      h+='<div class="sysblock"><div class="syshead"><span class="t">'+esc(s.name)+'</span><span class="pill ok">√ '+list.length+' 项</span></div>'+groupBlocks(list,s,{forceTable:true})+'</div>';
    });
  });
  h+='<div class="sec-head"><h3>附：暂无角色映射的权限清单 <span class="count">'+D.stats.plainItems+' 条</span></h3></div>';
  D.systems.filter(s=>!s.matrix).forEach(s=>{h+='<div class="sysblock"><div class="syshead"><span class="t">'+esc(s.name)+'</span><span class="pill warn">待补充</span><span class="spacer"></span><span class="muted" style="font-size:11.5px">'+s.items.length+' 项</span></div>'+groupBlocks(s.items,s,{forceTable:true})+'</div>';});
  return h;
}

function render(keepScroll){
  renderSidebar();
  $('#showNo').checked=state.showNo;
  let h;
  if(state.full) h=fullView();
  else if(state.q.trim()) h=searchView(state.q.trim());
  else if(state.view==='role') h=roleView(state.key);
  else if(state.view==='system') h=systemView(state.key);
  else h=overview();
  $('#content').innerHTML=h;
  $('#content').querySelectorAll('[data-role]').forEach(c=>c.addEventListener('click',()=>{state.view='role';state.key=c.dataset.role;state.full=false;render();window.scrollTo({top:0,behavior:'smooth'});}));
  document.querySelector('.toggle-wrap').style.display = (state.view==='role'&&!state.full&&!state.q.trim())?'flex':'none';
  if(state.layout==='mind') mmApplyZoom();
  if(!keepScroll) window.scrollTo({top:0});
}

function showToast(msg){
  const el=document.getElementById('toast'); if(!el) return;
  el.textContent=msg; el.classList.add('show');
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>el.classList.remove('show'),1700);
}
function copyText(t){
  const done=()=>showToast('已复制权限标识：'+t);
  const fallback=()=>{
    const ta=document.createElement('textarea'); ta.value=t;
    ta.style.cssText='position:fixed;top:-9999px;left:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(err){ showToast('复制未成功，请手动选择文本'); }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(done).catch(fallback); }
  else fallback();
}
document.getElementById('content').addEventListener('click',e=>{
  if(mmDragMoved){ mmDragMoved=false; return; }
  const lb=e.target.closest('[data-layout]');
  if(lb){ const v=lb.getAttribute('data-layout'); if(v!==state.layout){ state.layout=v; render(true); } return; }
  const mb=e.target.closest('[data-mm]');
  if(mb){
    const act=mb.getAttribute('data-mm');
    const mid=mb.getAttribute('data-map');
    const dropMap=()=>{ [...mmState.collapsed].forEach(k=>{ if(k.indexOf(mid+'|')===0) mmState.collapsed.delete(k); }); };
    const restZoom=()=>{ mmState.zoom[mid]={k:1,kSet:false,centered:false}; };
    if(act==='all'){ dropMap(); restZoom(); render(true); return; }
    if(act==='default'){ dropMap(); (mmState.mapDefaults[mid]||[]).forEach(k=>mmState.collapsed.add(k)); restZoom(); render(true); return; }
    const z=mmState.zoom[mid]||(mmState.zoom[mid]={k:1,kSet:false,centered:false});
    if(act==='in'){ z.k=Math.min(2.6,z.k*1.2); mmApplyZoom(mid); return; }
    if(act==='out'){ z.k=Math.max(0.35,z.k/1.2); mmApplyZoom(mid); return; }
    if(act==='one'){ z.k=1; mmApplyZoom(mid); return; }
    if(act==='fit'){
      const c=document.getElementById('mmc-'+mid); const svg=c&&c.querySelector('svg');
      if(svg){ z.k=Math.min(1.6,Math.max(0.3,(c.clientWidth-64)/(+svg.dataset.w))); z.centered=false; mmApplyZoom(mid); }
      return;
    }
  }
  const jm=e.target.closest('[data-jump]');
  if(jm){
    const t=document.getElementById('mmsys-'+jm.getAttribute('data-jump'));
    if(t) t.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  const mn=e.target.closest('[data-mmkey]');
  if(mn){
    const k=mn.getAttribute('data-mmkey');
    if(mmState.collapsed.has(k)) mmState.collapsed.delete(k); else mmState.collapsed.add(k);
    render(true); return;
  }
  const ex=e.target.closest('[data-expand]');
  if(ex){
    const all=ex.getAttribute('data-expand')==='all';
    document.querySelectorAll('#content .tnode').forEach(n=>n.classList.toggle('collapsed',!all));
    return;
  }
  const tg=e.target.closest('[data-toggle]');
  if(tg){ tg.parentElement.classList.toggle('collapsed'); return; }
  const cp=e.target.closest('[data-copy]');
  if(cp){ copyText(cp.getAttribute('data-copy')); }
});

let mmDrag=null, mmDragMoved=false;
document.getElementById('content').addEventListener('pointerdown',e=>{
  const c=e.target.closest('.mmcanvas'); if(!c) return;
  mmDrag={c,x:e.clientX,y:e.clientY,l:c.scrollLeft,t:c.scrollTop,moved:0};
  c.classList.add('dragging');
});
window.addEventListener('pointermove',e=>{
  if(!mmDrag) return;
  const dx=e.clientX-mmDrag.x, dy=e.clientY-mmDrag.y;
  mmDrag.moved=Math.max(mmDrag.moved,Math.abs(dx)+Math.abs(dy));
  mmDrag.c.scrollLeft=mmDrag.l-dx;
  mmDrag.c.scrollTop=mmDrag.t-dy;
});
window.addEventListener('pointerup',()=>{
  if(!mmDrag) return;
  mmDragMoved=mmDrag.moved>5;
  mmDrag.c.classList.remove('dragging');
  mmDrag=null;
});
document.getElementById('content').addEventListener('wheel',e=>{
  const c=e.target.closest('.mmcanvas'); if(!c) return;
  e.preventDefault();
  const mid=c.getAttribute('data-map');
  const z=mmState.zoom[mid]||(mmState.zoom[mid]={k:1,kSet:false,centered:false});
  const rect=c.getBoundingClientRect();
  const px=e.clientX-rect.left, py=e.clientY-rect.top;
  const k0=z.k;
  const k1=Math.min(2.6,Math.max(0.35,k0*(e.deltaY>0?0.92:1.08)));
  const r=k1/k0;
  z.k=k1; mmApplyZoom(mid);
  c.scrollLeft=(c.scrollLeft+px)*r-px;
  c.scrollTop=(c.scrollTop+py)*r-py;
},{passive:false});

$('#q').addEventListener('input',e=>{state.q=e.target.value;$('#clearq').style.display=state.q?'block':'none';state.full=false;render();});
$('#clearq').addEventListener('click',()=>{state.q='';$('#q').value='';$('#clearq').style.display='none';render();});
$('#showNo').addEventListener('change',e=>{state.showNo=e.target.checked;render();});
$('#printBtn').addEventListener('click',()=>window.print());
$('#fullBtn').addEventListener('click',()=>{state.full=!state.full;if(state.full){state.q='';$('#q').value='';$('#clearq').style.display='none';}render();});
render();
</script>
</body>
</html>
